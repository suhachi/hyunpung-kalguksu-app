name: 작업완료보고서(자동 점검용)
description: 보고서 등록 시 자동으로 체크리스트 이슈가 생성됩니다.
labels: ["report","qa-check"]
body:
  - type: input
    id: scope
    attributes:
      label: 작업 범위
      placeholder: 예) 이미지 업로드 / 로그인 / CORS / Rules
  - type: textarea
    id: summary
    attributes:
      label: 요약
      placeholder: 핵심 변경점/리스크
  - type: checkboxes
    id: checks
    attributes:
      label: 기본 체크
      options:
        - label: 로그인 플로우 통과
        - label: Firestore role 확인
        - label: OPTIONS 200, PUT 200
        - label: Storage 경로 생성 확인
        - label: 이전 이미지 삭제 확인
        - label: 토스트/로딩 정상

